- name: '关闭扫码权限-M'
  setup_method: 'update_login_qr_code(0)'  
  teardown_method: 'update_login_qr_code(1)'
  steps:
    - page: 'M_LoginPage'
      actions:
        - method: 'check_and_handle_popups'
          params: 3
        - method: 'login'
          params: ['lxr55', 'Test123#']
    - page: 'M_HomePage'
      actions:
        - method: 'check_and_handle_popups'
          params: 3  
        - method: 'check_connected'
          params: 'M_s300048'    
        - method: 'searchuser'
          params: 'ruby'
        - method: 'screenshot'
    - page: 'M_UserProfilePage'
      actions:
        - method: 'click_element'
          params: 'start_detect_button'
        - method: 'screenshot'
          params: 'start_detect_button'
    - page: 'M_DetectPage'
      actions:
        - method: 'wait'
          params: 2
        - method: 'detect_success'
    - page: 'M_ReportPage'
      actions:
        - method: 'wait_for_element_to_appear'
          params: ['zhfx', 200]
        - method: 'swipe_up'
        - method: 'screenshot'
          params: 'end'
        - method: 'close_app'
