- name: '关闭扫码权限-V'
  setup_method: 'update_login_qr_code(0)'
  teardown_method: 'update_login_qr_code(1)'
  steps:
    - page: 'V_LoginPage'
      actions:
        - method: 'open_app'
        - method: 'check_and_handle_popups'
          params: 3
        - method: 'login'
          params: ['lxr55', 'Test123#']
    - page: 'V_HomePage'
      actions:
        - method: 'check_and_handle_popups'
          params: 3
        - method: 'connect'
          params: 's300048'
        - method: 'searchuser'
          params: 'ruby'
        - method: 'screenshot'
    - page: 'V_UserProfilePage'
      actions:
        - method: 'click_element'
          params: 'start_detect_button'
        - method: 'screenshot'
          params: 'start_detect_button'
    - page: 'V_DetectPage'
      actions:
        - method: 'wait'
          params: 2
        - method: 'detect_success'
    - page: 'V_ReportPage'
      actions:
        - method: 'wait_for_element_to_appear'
          params: ['zhfx', 400]
        - method: 'swipe_up'
        - method: 'screenshot'
          params: 'end'
        - method: 'close_app'

