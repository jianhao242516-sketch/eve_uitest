- name: '检测流程'
  # setup_method: 'setup_method_1'  # 可选：指定前置方法名，在启动app前会先调用该方法
  # teardown_method: 'teardown_method_1'  # 可选：指定清理方法名，在用例执行完成后会调用该方法
  steps:
    - page: 'M_HomePage'
      actions:
        - method: 'check_and_handle_popups'
          params: 3
        - method: 'check_connected'
          params: 'M_s300003'
        - method: 'searchuser'
          params: 'Ios检测'
    - page: 'M_UserProfilePage'
      actions:
        - method: 'click_element'
          params: 'start_detect_button'
        - method: 'screenshot'
          params: 'start_detect_button'
    - page: 'M_DetectPage'
      actions:
        - method: 'detect_success'
    - page: 'M_ReportPage'
      actions:
        - method: 'wait_for_element_to_appear'
          params: ['zhfx', 200]
        - method: 'swipe_up'
        - method: 'screenshot'
          params: 'end'
        # - method: 'swipe_down'

