- name: '检测流程'
  steps:
    - page: 'M_LoginPage'
      actions:
        - method: 'check_and_handle_popups'
          params: 3
        - method: 'login'
          params: ['lxr55', 'Test123#']
    - page: 'M_HomePage'
      actions:
        - method: 'check_and_handle_popups'
          params: 3
        - method: 'connect'
          params: '200018'
        - method: 'searchuser'
          params: 'ruby'
    - page: 'M_UserProfilePage'
      actions:
        - method: 'click_element'
