#持续集成UI自动化测试脚本
- name: '登录流程-M'
  steps:
    - page: 'M_LoginPage'
      actions:
        - method: 'open_app'
        - method: 'check_and_handle_popups'
          params: 3
        - method: 'login'
          params: ['lxr55', 'Test123#']
    - page: 'M_HomePage'
      actions:
        - method: 'check_and_handle_popups'
          params: 3
        - method: 'connect'
          params: 'ruby 1'
        - method: 'searchuser'
          params: 'ruby'
    - page: 'M_UserProfilePage'
      actions:
        - method: 'click_element'
          params: 'start_detect_button'
        - method: 'screenshot'
          params: 'start_detect_button'
    - page: 'M_DetectPage'
      actions:
        - method: 'wait'
          params: 2
        - method: 'click_element'
          params: 'still_button'
    - page: 'M_ReportPage'
      actions:
        - method: 'wait_for_element_to_appear'
          params: ['zhfx', 600]
        - method: 'swipe_up'
        - method: 'screenshot'
          params: 'end'     
