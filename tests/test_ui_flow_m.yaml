          params: 'start_detect_button'
    - page: 'M_DetectPage'
      actions:
        - method: 'wait'
          params: 2
        - method: 'click_element'
          params: 'still_button'
    - page: 'M_ReportPage'
      actions:
        - method: 'wait_for_element_to_appear'
          params: ['zhfx', 200]
        - method: 'swipe_up'
        - method: 'screenshot'
          params: 'end'
