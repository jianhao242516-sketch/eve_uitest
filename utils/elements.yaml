  camera_button: ['xpath', "//XCUIElementTypeButton[@name='拍照']"]
  still_button: ['xpath', "//XCUIElementTypeStaticText[@name='仍旧拍摄']"]
  video_button: ['xpath', "//XCUIElementTypeButton[@name='视频检测']"]
  result_label: ['xpath', "//XCUIElementTypeStaticText[@name='检测结果']"]
  detect_next_button: ['xpath', "//XCUIElementTypeStaticText[@name='下一步']"]
  shooting_button: ['xpath', "//XCUIElementTypeStaticText[@name='拍摄中...']"]
