  searchresult1: ['xpath', "//XCUIElementTypeCollectionView/XCUIElementTypeCell[1]/XCUIElementTypeOther"]
  search_button: ['xpath', "//XCUIElementTypeButton[@name='搜索']"]
  
UserProfilePage:
  start_detect_button: ['xpath', "//XCUIElementTypeStaticText[@name='开始检测']"]
  user_avatar: ['xpath', "//XCUIElementTypeImage[@name='头像']"]
  username_label: ['xpath', "//XCUIElementTypeStaticText[@name='用户名']"]
  
