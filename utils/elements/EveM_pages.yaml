# EveV 页面元素定义

# 首页元素
M_HomePage:
  searchuser: ['xpath', "//XCUIElementTypeTextField"]
  searchresult1: ['xpath', "//XCUIElementTypeCollectionView/XCUIElementTypeCell[1]/XCUIElementTypeOther"]
  search_button: ['xpath', "//XCUIElementTypeButton[@name='搜索']"]
  connect_wlj: ['xpath', "//XCUIElementTypeStaticText[@name='未连接']"]
  connected_button: ['xpath', "//XCUIElementTypeStaticText[@name='连接良好']"]
  connected_button_1: ['xpath', "//XCUIElementTypeStaticText[@name='已连接']"]
  connected_button_2: ['xpath', "//XCUIElementTypeStaticText[@name='网络较差']"]
  connect_next_button: ['xpath', "//XCUIElementTypeStaticText[@name='下一步']"]
  connect_password_input: ['xpath', "//XCUIElementTypeStaticText[@name='请输入Wi-Fi密码']"]
  connect_password_button: ['xpath', "//XCUIElementTypeButton[@name='连接']"]
  # 作为连接成功后的判定备用（与 connected_button 等价，便于代码复用）
  connect_disconnect_button: ['xpath', "//*[@name='连接良好' or contains(@name,'连接良好')]"]
  store_management_button: ['xpath', "//XCUIElementTypeStaticText[@name='门店管理']"]
  nm_ksjc_button: ['xpath', "//XCUIElementTypeStaticText[@name='开始检测']"]
  nm_next_button: ['xpath', "//XCUIElementTypeStaticText[@name='下一步']"]
  newuser_button: ['xpath', "//XCUIElementTypeButton[@name='新客']"]
# 用户资料页元素
M_UserProfilePage:
  start_detect_button: ['xpath', "//XCUIElementTypeStaticText[@name='开始检测']"]
  user_avatar: ['xpath', "//XCUIElementTypeImage[@name='头像']"]
  username_label: ['xpath', "//XCUIElementTypeStaticText[@name='用户名']"]
  # 最新报告/新建报告按钮 - 优先用 ios class chain
  new_report_button: ['ios_class_chain', "**/XCUIElementTypeWindow[1]/XCUIElementTypeOther[2]/XCUIElementTypeOther/XCUIElementTypeOther/XCUIElementTypeOther/XCUIElementTypeOther/XCUIElementTypeOther/XCUIElementTypeScrollView/XCUIElementTypeScrollView/XCUIElementTypeOther/XCUIElementTypeOther/XCUIElementTypeOther[1]/XCUIElementTypeButton"]
  # 备用 xpath:
  # ['xpath', "//XCUIElementTypeApplication[@name='美图宜肤M']/XCUIElementTypeWindow[1]/XCUIElementTypeOther[2]/XCUIElementTypeOther/XCUIElementTypeOther/XCUIElementTypeOther/XCUIElementTypeOther/XCUIElementTypeScrollView/XCUIElementTypeScrollView/XCUIElementTypeOther/XCUIElementTypeOther/XCUIElementTypeOther[1]/XCUIElementTypeButton"]

# 新建用户页（新客建档）
M_NewUserPage:
  phone_input: ['xpath', "//XCUIElementTypeTextField[@value='请输入电话号码']"]
  gender_male: ['xpath', "//XCUIElementTypeLink[@name='男']"]
  gender_female: ['xpath', "//XCUIElementTypeLink[@name='女']"]
  birthday_select: ['xpath', "//XCUIElementTypeStaticText[@name='请选择出生日期']"]
  birthday_confirm: ['xpath', "//XCUIElementTypeStaticText[@name='确定']"]
  # 协议勾选（你最新抓到的层级是 [13]，旧的 [14] 会点到空位置）
  agreement_checkbox_chain: ['ios_class_chain', "**/XCUIElementTypeWindow[1]/XCUIElementTypeOther[2]/XCUIElementTypeOther/XCUIElementTypeOther/XCUIElementTypeOther/XCUIElementTypeOther/XCUIElementTypeOther/XCUIElementTypeOther[2]/XCUIElementTypeWebView/XCUIElementTypeWebView/XCUIElementTypeWebView/XCUIElementTypeOther/XCUIElementTypeOther/XCUIElementTypeOther/XCUIElementTypeOther/XCUIElementTypeOther[13]"]
  agreement_checkbox: ['xpath', "//XCUIElementTypeApplication[@name='美图宜肤M']/XCUIElementTypeWindow[1]/XCUIElementTypeOther[2]/XCUIElementTypeOther/XCUIElementTypeOther/XCUIElementTypeOther/XCUIElementTypeOther/XCUIElementTypeOther/XCUIElementTypeOther[2]/XCUIElementTypeWebView/XCUIElementTypeWebView/XCUIElementTypeWebView/XCUIElementTypeOther/XCUIElementTypeOther/XCUIElementTypeOther/XCUIElementTypeOther/XCUIElementTypeOther[13]"]
  next_step: ['xpath', "//XCUIElementTypeStaticText[@name='下一步']"]

# 检测页元素
M_DetectPage:
  camera_button: ['xpath', "//XCUIElementTypeButton[@name='拍照']"]
  still_button: ['xpath', "//XCUIElementTypeStaticText[@name='仍旧拍摄']"]
  video_button: ['xpath', "//XCUIElementTypeButton[@name='视频检测']"]
  result_label: ['xpath', "//XCUIElementTypeStaticText[@name='检测结果']"]
  detect_next_button: ['xpath', "//XCUIElementTypeStaticText[@name='下一步']"]
  shooting_button: ['xpath', "//XCUIElementTypeStaticText[@name='拍摄中...']"]
  cj_confirm_button: ['xpath', "//XCUIElementTypeStaticText[@name='确认']"]
  cj_retake_button: ['xpath', "//XCUIElementTypeStaticText[@name='重新拍摄']"]
  back_button: ['xpath', "//XCUIElementTypeImage[@name='detect_back_icon']"]
  confirm_button: ['xpath', "//XCUIElementTypeStaticText[@name='确定']"]
  i_know_button: ['xpath', "//XCUIElementTypeStaticText[@name='我知道了']"]
  continue_button: ['xpath', "//XCUIElementTypeStaticText[@name='继续']"]
  delete_button: ['xpath', "//XCUIElementTypeStaticText[@name='删除并继续']"] #云存储空间已满
